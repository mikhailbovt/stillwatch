[project]
name = "stillwatch"
version = "0.5.0"
description = "Local video triage for visible medical and fire incidents."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "opencv-python>=4.11,<6",
  "numpy>=2,<3",
  "httpx>=0.28,<1",
  "psutil>=6,<8",
]

[project.optional-dependencies]
inference = ["ultralytics>=8.4,<9", "safetensors>=0.5,<1", "torch>=2.6,<3", "torchvision>=0.21,<1"]
cloud = ["openai>=2,<3", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
stillwatch = "stillwatch.cli:main"

[project.urls]
Repository = "https://github.com/mikhailbovt/stillwatch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stillwatch"]

[tool.hatch.build.targets.wheel.force-include]
"models.lock.json" = "stillwatch/models.lock.json"

[tool.hatch.build.targets.sdist]
include = ["src", "configs/default.yaml", "tools", "tests", "sdk", "examples", "docs", "api", "pyproject.toml", "uv.lock", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "models.lock.json", "Dockerfile", ".dockerignore"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
