[project]
name = "stillwatch-sdk"
version = "0.5.0"
description = "Typed HTTP client for the Stillwatch video observation service."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.urls]
Repository = "https://github.com/mikhailbovt/stillwatch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stillwatch_sdk"]
